<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#071426">
  <title>Leitor SSCC</title>
  <script src="https://unpkg.com/@zxing/browser@latest"></script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;width:100%;min-height:100%;background:#071426;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
    .app{width:100%;max-width:700px;padding:18px}
    .header{text-align:center;margin-bottom:18px}
    .header h1{margin:0;font-size:22px;line-height:1.25;font-weight:700}
    .header p{margin:7px 0 0;color:#aebdce;font-size:14px}
    .card{background:#0d1d31;border:1px solid #21364f;border-radius:18px;padding:16px;margin-bottom:15px;box-shadow:0 8px 25px rgba(0,0,0,.18)}
    .card h2{margin:0 0 12px;font-size:17px}
    .camera-area{position:relative;width:100%;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
    #video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
    .scan-frame{position:absolute;left:5%;right:5%;top:30%;height:40%;border:3px solid #00ff88;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.18),0 0 18px rgba(0,255,136,.45);pointer-events:none}
    .scan-line{position:absolute;left:5%;right:5%;top:50%;height:2px;background:#00ff88;box-shadow:0 0 10px #00ff88;pointer-events:none;animation:scanline 1.8s linear infinite}
    @keyframes scanline{0%{transform:translateY(-55px)}50%{transform:translateY(55px)}100%{transform:translateY(-55px)}}
    .status{margin-top:12px;padding:11px 12px;border-radius:10px;background:#13283f;color:#d9e6f3;font-size:14px;line-height:1.4;text-align:center}
    .status.ok{background:#103925;color:#9ff0bd}.status.error{background:#451c24;color:#ffb8c1}.status.warning{background:#493a13;color:#ffe69b}
    .buttons{display:flex;gap:10px;margin-top:12px}
    button{flex:1;min-height:50px;border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    #btnStart{background:#00c878;color:#001b10}#btnStop{background:#33465d;color:#fff}
    .field{margin-top:10px}
    input{width:100%;min-height:50px;border:1px solid #334b66;border-radius:11px;background:#071426;color:#fff;padding:12px 14px;font-size:17px;outline:none}
    input:focus{border-color:#00c878}
    .btn-processar{width:100%;margin-top:10px;background:#198cff;color:#fff}
    .result{display:none}.result-code{word-break:break-all;background:#071426;border:1px solid #29425f;border-radius:10px;padding:13px;font-size:17px;font-weight:700;text-align:center;letter-spacing:.5px}
    .debug{margin-top:10px;font-size:12px;color:#8fa5bc;text-align:center;word-break:break-word}
    .footer{text-align:center;color:#71869d;font-size:12px;padding:8px 0 20px}
    @media(max-width:480px){.app{padding:12px}.header h1{font-size:20px}}
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>SSCC - CONTROLO DE RECEÇÃO CFL . SFW</h1>
    <p>Leitor de SSCC · Code 128 / GS1-128</p>
  </div>

  <div class="card">
    <h2>Leitura por câmara</h2>
    <div class="camera-area">
      <video id="video" autoplay muted playsinline webkit-playsinline></video>
      <div class="scan-frame"></div>
      <div class="scan-line"></div>
    </div>
    <div id="cameraStatus" class="status">Prima "Iniciar câmara" e aponte para o código de barras.</div>
    <div class="buttons">
      <button id="btnStart" onclick="iniciarCamera()">📷 Iniciar câmara</button>
      <button id="btnStop" onclick="pararCamera()" disabled>⏹ Parar</button>
    </div>
    <div id="debug" class="debug"></div>
  </div>

  <div class="card">
    <h2>Introdução manual de SSCC</h2>
    <div class="field">
      <input id="scanner" type="text" inputmode="numeric" autocomplete="off" placeholder="Introduza o SSCC">
    </div>
    <button class="btn-processar" onclick="processarManual()">Processar SSCC</button>
  </div>

  <div id="resultado" class="card result">
    <h2>SSCC lido</h2>
    <div id="resultadoCode" class="result-code"></div>
  </div>

  <div class="footer">Controlo de receção CFL . SFW</div>
</div>

<script>
  let scannerAtivo = false;
  let codigoEncontrado = false;
  let codeReader = null;
  let cameraStream = null;
  let nativeDetector = null;
  let usarDetectorNativo = false;
  let nativeLoopId = null;

  const video = document.getElementById('video');
  const cameraStatus = document.getElementById('cameraStatus');
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const scanner = document.getElementById('scanner');
  const resultado = document.getElementById('resultado');
  const resultadoCode = document.getElementById('resultadoCode');
  const debug = document.getElementById('debug');

  async function iniciarCamera(){
    if(scannerAtivo) return;

    try{
      codigoEncontrado = false;
      btnStart.disabled = true;
      btnStop.disabled = false;
      cameraStatus.className = 'status';
      cameraStatus.textContent = 'A preparar a câmara...';
      debug.textContent = 'A procurar Code 128 / GS1-128...';

      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        throw new Error('O navegador não suporta acesso à câmara.');
      }

      try{
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video:{
            facingMode:{ideal:'environment'},
            width:{ideal:1920},
            height:{ideal:1080},
            frameRate:{ideal:30}
          },
          audio:false
        });
      }catch(e){
        console.warn('Falha na resolução preferida:', e);
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video:true,
          audio:false
        });
      }

      video.srcObject = cameraStream;
      await video.play();
      scannerAtivo = true;

      cameraStatus.className = 'status ok';
      cameraStatus.textContent = '✓ Câmara ativa. Aponte o código de barras para a linha verde.';

      await criarLeitor();
    }catch(e){
      console.error('ERRO AO INICIAR CÂMARA:', e);
      pararCamera();
      cameraStatus.className = 'status error';
      cameraStatus.textContent = traduzirErroCamera(e);
      debug.textContent = '';
    }
  }

  async function criarLeitor(){
    try{
      if('BarcodeDetector' in window &&
         typeof BarcodeDetector.getSupportedFormats === 'function'){

        const formatos = await BarcodeDetector.getSupportedFormats();

        if(formatos.includes('code_128')){
          nativeDetector = new BarcodeDetector({formats:['code_128']});
          usarDetectorNativo = true;
          debug.textContent = 'Leitor nativo Code 128 ativo.';
          iniciarLeituraNativa();
          return;
        }
      }
    }catch(e){
      console.warn('BarcodeDetector não disponível:', e);
    }

    try{
      if(!window.ZXingBrowser || !window.ZXingBrowser.BrowserMultiFormatReader){
        throw new Error('Biblioteca ZXing não carregada.');
      }

      codeReader = new window.ZXingBrowser.BrowserMultiFormatReader();
      usarDetectorNativo = false;
      debug.textContent = 'Leitor ZXing ativo.';
      iniciarDecoding();
    }catch(e){
      console.error('Erro ao criar leitor:', e);
      cameraStatus.className = 'status error';
      cameraStatus.textContent = 'Não foi possível iniciar o leitor: ' + e.message;
    }
  }

  async function iniciarLeituraNativa(){
    if(!nativeDetector || !scannerAtivo) return;

    try{
      const detections = await nativeDetector.detect(video);

      if(detections && detections.length > 0){
        const codigo = String(detections[0].rawValue || '').trim().replace(/\s+/g,'');
        if(codigo){
          processarCodigoDetetado(codigo);
          return;
        }
      }
    }catch(e){
      console.debug('Leitura nativa:', e);
    }

    if(scannerAtivo){
      nativeLoopId = requestAnimationFrame(iniciarLeituraNativa);
    }
  }

  function iniciarDecoding(){
    if(!codeReader) return;

    try{
      codeReader.decodeFromVideoElement(video, function(result, error){
        if(!scannerAtivo || codigoEncontrado || !result) return;

        let codigo = '';
        try{
          codigo = String(result.getText() || '').trim().replace(/\s+/g,'');
        }catch(e){
          console.warn('Erro ao obter texto:', e);
          return;
        }

        if(codigo) processarCodigoDetetado(codigo);
      });
    }catch(e){
      console.error('Erro no decode:', e);
      cameraStatus.className = 'status error';
      cameraStatus.textContent = 'Erro no leitor de códigos: ' + e.message;
    }
  }

  function processarCodigoDetetado(codigo){
    if(!scannerAtivo || codigoEncontrado) return;

    const codigoLimpo = limparCodigoGS1(codigo);
    debug.textContent = 'Código detetado: ' + codigoLimpo;

    if(!/^\d+$/.test(codigoLimpo)){
      cameraStatus.className = 'status warning';
      cameraStatus.textContent = 'Código detetado, mas contém caracteres não numéricos.';
      return;
    }

    if(codigoLimpo.length < 22){
      cameraStatus.className = 'status warning';
      cameraStatus.textContent = 'Código detetado, mas demasiado curto para o SSCC.';
      return;
    }

    codigoEncontrado = true;
    cameraStatus.className = 'status ok';
    cameraStatus.textContent = '✓ SSCC encontrado. A enviar...';
    resultadoCode.textContent = codigoLimpo;
    resultado.style.display = 'block';

    pararCamera();
    devolverSSCC(codigoLimpo);
  }

  function limparCodigoGS1(codigo){
    let valor = String(codigo || '').trim().replace(/\s+/g,'');

    if(valor.startsWith('(00)')) valor = valor.substring(4);

    valor = valor.replace(/[\x1D\x1E\x1F]/g,'');
    return valor;
  }

  function pararCamera(){
    scannerAtivo = false;

    if(nativeLoopId !== null){
      cancelAnimationFrame(nativeLoopId);
      nativeLoopId = null;
    }

    try{
      if(codeReader) codeReader.reset();
    }catch(e){
      console.warn('Erro ao fazer reset do leitor:', e);
    }

    codeReader = null;
    nativeDetector = null;
    usarDetectorNativo = false;

    if(cameraStream){
      try{
        cameraStream.getTracks().forEach(track => track.stop());
      }catch(e){
        console.warn(e);
      }
    }

    cameraStream = null;

    try{
      video.pause();
      video.srcObject = null;
    }catch(e){
      console.warn(e);
    }

    btnStart.disabled = false;
    btnStop.disabled = true;
  }

  function devolverSSCC(codigo){
    try{
      const params = new URLSearchParams(window.location.search);
      const returnUrl = params.get('return');

      if(!returnUrl){
        cameraStatus.className = 'status error';
        cameraStatus.textContent = 'SSCC encontrado, mas não foi definido um endereço de retorno.';
        btnStart.disabled = false;
        return;
      }

      const url = new URL(returnUrl);
      url.searchParams.set('sscc', codigo);

      cameraStatus.className = 'status ok';
      cameraStatus.textContent = '✓ SSCC lido. A regressar à aplicação...';

      setTimeout(() => {
        window.location.href = url.toString();
      }, 700);
    }catch(e){
      console.error('ERRO AO DEVOLVER SSCC:', e);
      cameraStatus.className = 'status error';
      cameraStatus.textContent = 'SSCC encontrado, mas não foi possível regressar à aplicação.';
      btnStart.disabled = false;
    }
  }

  function processarManual(){
    const codigo = String(scanner.value || '').trim().replace(/\s+/g,'');

    if(!codigo){
      alert('Introduza um SSCC.');
      scanner.focus();
      return;
    }

    resultadoCode.textContent = codigo;
    resultado.style.display = 'block';
    processarCodigo(codigo);
  }

  function processarCodigo(codigo){
    const valor = String(codigo || '').trim().replace(/\s+/g,'');

    if(!valor){
      cameraStatus.className = 'status error';
      cameraStatus.textContent = 'SSCC vazio.';
      return;
    }

    cameraStatus.className = 'status';
    cameraStatus.textContent = 'A processar SSCC...';

    /*
     * Esta função só funciona dentro do Apps Script.
     * No GitHub Pages é mantida apenas para o campo manual.
     */
    cameraStatus.className = 'status warning';
    cameraStatus.textContent = 'O processamento deve ser feito através da aplicação Scanner_Telemovel.';
  }

  function traduzirErroCamera(erro){
    if(!erro) return 'Não foi possível iniciar a câmara.';

    const nome = erro.name || '';

    if(nome === 'NotAllowedError') return 'PERMISSÃO DE CÂMARA RECUSADA. Verifique as permissões do navegador.';
    if(nome === 'NotFoundError') return 'Não foi encontrada nenhuma câmara neste dispositivo.';
    if(nome === 'NotReadableError') return 'A câmara está a ser utilizada por outra aplicação.';
    if(nome === 'SecurityError') return 'O navegador bloqueou o acesso à câmara por motivos de segurança.';
    if(nome === 'AbortError') return 'O acesso à câmara foi interrompido.';

    return 'Não foi possível iniciar a câmara: ' + (erro.message || nome);
  }

  scanner.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      processarManual();
    }
  });
</script>
</body>
</html>
