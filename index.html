<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner SSCC</title>
  <script src="https://unpkg.com/@zxing/browser@latest"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:20px;color:#1f2937;text-align:center}
    .card{max-width:560px;margin:auto;background:white;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0001}
    video{width:100%;max-height:420px;background:#111;border-radius:12px;object-fit:cover}
    button{border:0;border-radius:10px;padding:12px 18px;margin:6px;font-size:16px;cursor:pointer}
    #status{margin:14px 0;font-weight:bold;white-space:pre-wrap}
    .ok{color:#15803d}.error{color:#b91c1c}
  </style>
</head>
<body>
  <div class="card">
    <h2>Leitura de SSCC</h2>
    <video id="video" autoplay muted playsinline></video>
    <div id="status">A iniciar a câmara...</div>
    <button id="btnStop" type="button">Parar câmara</button>
  </div>

<script>
  let reader = null;
  let controls = null;
  let enviado = false;

  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');

  function status(text, cls='') {
    statusEl.textContent = text;
    statusEl.className = cls;
  }

  function normalizar(codigo) {
    return String(codigo || '').replace(/\s+/g, '').trim();
  }

  function devolverSSCC(codigo) {
    if (enviado) return;
    codigo = normalizar(codigo);

    if (!codigo || !/^\d{22,}$/.test(codigo)) {
      status('Código lido, mas não parece ser um SSCC válido.', 'error');
      return;
    }

    enviado = true;
    if (controls) controls.stop();

    // Método principal: enviar o SSCC para a janela que abriu este scanner.
    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage({
          type: 'SSCC_SCAN_RESULT',
          sscc: codigo
        }, '*');

        status('SSCC enviado para a aplicação. Pode regressar à janela anterior.', 'ok');
        setTimeout(() => window.close(), 900);
        return;
      } catch (e) {
        console.error(e);
      }
    }

    // Fallback: regressar através do parâmetro sscc na URL.
    const returnUrl = new URLSearchParams(window.location.search).get('return');
    if (returnUrl) {
      try {
        const url = new URL(returnUrl);
        url.searchParams.set('sscc', codigo);
        window.location.assign(url.toString());
        return;
      } catch (e) {
        console.error(e);
      }
    }

    // Último recurso: mostrar o código para cópia manual.
    status('Não foi possível contactar a aplicação de origem. SSCC: ' + codigo, 'error');
    const input = document.createElement('input');
    input.value = codigo;
    input.readOnly = true;
    input.style.cssText = 'width:90%;padding:12px;font-size:18px;margin-top:12px';
    document.querySelector('.card').appendChild(input);
  }

  async function iniciar() {
    try {
      status('A solicitar acesso à câmara...');
      reader = new ZXingBrowser.BrowserMultiFormatReader();
      const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
      const deviceId = devices.length ? devices[devices.length - 1].deviceId : undefined;

      controls = await reader.decodeFromVideoDevice(deviceId, video, (result, error) => {
        if (result) devolverSSCC(result.getText());
      });

      status('Câmara ativa. Aponte para o código SSCC.');
    } catch (e) {
      console.error(e);
      status('Não foi possível iniciar a câmara. Verifique as permissões do navegador.', 'error');
    }
  }

  document.getElementById('btnStop').addEventListener('click', () => {
    if (controls) controls.stop();
    status('Câmara parada.');
  });

  iniciar();
</script>
</body>
</html>
