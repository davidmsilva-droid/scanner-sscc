<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#071426"
  >

  <title>Leitor SSCC</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:#071426;
      color:#ffffff;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .app{
      width:100%;
      max-width:700px;
      padding:18px;
    }

    .header{
      text-align:center;
      margin-bottom:18px;
    }

    .header h1{
      margin:0;
      font-size:22px;
      line-height:1.25;
      font-weight:700;
    }

    .header p{
      margin:7px 0 0;
      color:#aebdce;
      font-size:14px;
    }

    .card{
      background:#0d1d31;
      border:1px solid #21364f;
      border-radius:18px;
      padding:16px;
      margin-bottom:15px;
      box-shadow:0 8px 25px rgba(0,0,0,.18);
    }

    .card h2{
      margin:0 0 12px;
      font-size:17px;
    }

    .camera-area{
      position:relative;
      width:100%;
      background:#000;
      border-radius:14px;
      overflow:hidden;
      aspect-ratio:16/10;
    }

    #video{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      background:#000;
    }

    .scan-frame{
      position:absolute;
      left:8%;
      right:8%;
      top:31%;
      height:38%;
      border:3px solid #00ff88;
      border-radius:12px;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,.18),
        0 0 18px rgba(0,255,136,.45);
      pointer-events:none;
    }

    .scan-line{
      position:absolute;
      left:8%;
      right:8%;
      top:50%;
      height:2px;
      background:#00ff88;
      box-shadow:0 0 10px #00ff88;
      pointer-events:none;
      animation:scanline 1.8s linear infinite;
    }

    @keyframes scanline{
      0%{
        transform:translateY(-55px);
      }
      50%{
        transform:translateY(55px);
      }
      100%{
        transform:translateY(-55px);
      }
    }

    .status{
      margin-top:12px;
      padding:11px 12px;
      border-radius:10px;
      background:#13283f;
      color:#d9e6f3;
      font-size:14px;
      line-height:1.4;
      text-align:center;
    }

    .status.ok{
      background:#103925;
      color:#9ff0bd;
    }

    .status.error{
      background:#451c24;
      color:#ffb8c1;
    }

    .status.warning{
      background:#493a13;
      color:#ffe69b;
    }

    .buttons{
      display:flex;
      gap:10px;
      margin-top:12px;
    }

    button{
      flex:1;
      min-height:50px;
      border:0;
      border-radius:12px;
      padding:12px 14px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }

    button:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    #btnStart{
      background:#00c878;
      color:#001b10;
    }

    #btnStop{
      background:#33465d;
      color:#fff;
    }

    .field{
      margin-top:10px;
    }

    input{
      width:100%;
      min-height:50px;
      border:1px solid #334b66;
      border-radius:11px;
      background:#071426;
      color:#fff;
      padding:12px 14px;
      font-size:17px;
      outline:none;
    }

    input:focus{
      border-color:#00c878;
    }

    .btn-processar{
      width:100%;
      margin-top:10px;
      background:#198cff;
      color:#fff;
    }

    .result{
      display:none;
    }

    .result-code{
      word-break:break-all;
      background:#071426;
      border:1px solid #29425f;
      border-radius:10px;
      padding:13px;
      font-size:17px;
      font-weight:700;
      text-align:center;
      letter-spacing:.5px;
    }

    .debug{
      margin-top:10px;
      font-size:12px;
      color:#8fa5bc;
      text-align:center;
      word-break:break-word;
    }

    .footer{
      text-align:center;
      color:#71869d;
      font-size:12px;
      padding:8px 0 20px;
    }

    @media(max-width:480px){
      .app{
        padding:12px;
      }

      .header h1{
        font-size:20px;
      }

      .camera-area{
        aspect-ratio:4/3;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>SSCC - CONTROLO DE RECEÇÃO CFL . SFW</h1>
    <p>Leitor de SSCC · Code 128 / GS1-128</p>
  </div>


  <!-- CÂMARA -->
  <div class="card">

    <h2>Leitura por câmara</h2>

    <div class="camera-area">

      <video
        id="video"
        autoplay
        muted
        playsinline
        webkit-playsinline
      ></video>

      <div class="scan-frame"></div>
      <div class="scan-line"></div>

    </div>

    <div
      id="cameraStatus"
      class="status"
    >
      Prima "Iniciar câmara" e aponte para o código de barras.
    </div>

    <div class="buttons">

      <button
        id="btnStart"
        onclick="iniciarCamera()"
      >
        📷 Iniciar câmara
      </button>

      <button
        id="btnStop"
        onclick="pararCamera()"
        disabled
      >
        ⏹ Parar
      </button>

    </div>

    <div
      id="debug"
      class="debug"
    ></div>

  </div>


  <!-- SSCC MANUAL -->
  <div class="card">

    <h2>Introdução manual de SSCC</h2>

    <div class="field">

      <input
        id="scanner"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Introduza o SSCC"
      >

    </div>

    <button
      class="btn-processar"
      onclick="processarManual()"
    >
      Processar SSCC
    </button>

  </div>


  <!-- RESULTADO -->
  <div
    id="resultado"
    class="card result"
  >

    <h2>SSCC lido</h2>

    <div
      id="resultadoCode"
      class="result-code"
    ></div>

  </div>


  <div class="footer">
    Controlo de receção CFL . SFW
  </div>

</div>


<script>

  let scannerAtivo = false;
  let codigoEncontrado = false;

  let codeReader = null;
  let cameraStream = null;

  const video =
    document.getElementById('video');

  const cameraStatus =
    document.getElementById('cameraStatus');

  const btnStart =
    document.getElementById('btnStart');

  const btnStop =
    document.getElementById('btnStop');

  const scanner =
    document.getElementById('scanner');

  const resultado =
    document.getElementById('resultado');

  const resultadoCode =
    document.getElementById('resultadoCode');

  const debug =
    document.getElementById('debug');


  /*
   * ----------------------------------------------------
   * INICIAR CÂMARA
   * ----------------------------------------------------
   */

  async function iniciarCamera(){

    if(scannerAtivo){
      return;
    }

    try{

      codigoEncontrado = false;

      btnStart.disabled = true;
      btnStop.disabled = false;

      cameraStatus.className =
        'status';

      cameraStatus.textContent =
        'A preparar a câmara...';

      debug.textContent =
        'A procurar Code 128 / GS1-128...';


      if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ){

        throw new Error(
          'O navegador não suporta acesso à câmara.'
        );

      }


      /*
       * Primeiro tentamos a câmara traseira.
       */

      try{

        cameraStream =
          await navigator.mediaDevices.getUserMedia({

            video:{
              facingMode:{
                ideal:'environment'
              },

              width:{
                ideal:1920
              },

              height:{
                ideal:1080
              },

              frameRate:{
                ideal:30
              }
            },

            audio:false

          });

      }catch(e){

        console.warn(
          'Falha na resolução preferida:',
          e
        );


        /*
         * Fallback.
         */

        cameraStream =
          await navigator.mediaDevices.getUserMedia({

            video:true,

            audio:false

          });

      }


      video.srcObject =
        cameraStream;


      await video.play();


      scannerAtivo = true;


      cameraStatus.className =
        'status ok';

      cameraStatus.textContent =
        '✓ Câmara ativa. Aponte o código de barras para a linha verde.';

      debug.textContent =
        'Leitura automática Code 128 / GS1-128 ativa.';


      /*
       * Criar leitor ZXing.
       */

      if(
        !window.ZXingBrowser ||
        !window.ZXingBrowser.BrowserMultiFormatReader
      ){

        throw new Error(
          'Biblioteca de leitura de códigos não carregada.'
        );

      }


      criarLeitor();

    }catch(e){

      console.error(
        'ERRO AO INICIAR CÂMARA:',
        e
      );

      pararCamera();

      cameraStatus.className =
        'status error';

      cameraStatus.textContent =
        traduzirErroCamera(e);

      debug.textContent =
        '';

    }

  }


  /*
   * ----------------------------------------------------
   * CRIAR LEITOR
   * ----------------------------------------------------
   */

  function criarLeitor(){

    try{

      /*
       * Tentamos configurar o ZXing para:
       *
       * - Code 128
       * - maior esforço de leitura
       *
       * Se a versão carregada não expuser estes objetos,
       * usamos o leitor normal.
       */

      let hints = null;


      if(
        window.ZXingBrowser.DecodeHintType &&
        window.ZXingBrowser.BarcodeFormat
      ){

        hints = new Map();

        hints.set(
          window.ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS,
          [
            window.ZXingBrowser.BarcodeFormat.CODE_128
          ]
        );

        hints.set(
          window.ZXingBrowser.DecodeHintType.TRY_HARDER,
          true
        );

      }


      if(hints){

        codeReader =
          new window.ZXingBrowser.BrowserMultiFormatReader(
            hints
          );

      }else{

        codeReader =
          new window.ZXingBrowser.BrowserMultiFormatReader();

      }


      iniciarDecoding();

    }catch(e){

      console.error(
        'Erro ao criar leitor:',
        e
      );

      cameraStatus.className =
        'status error';

      cameraStatus.textContent =
        'Não foi possível iniciar o leitor de códigos.';

    }

  }


  /*
   * ----------------------------------------------------
   * DECODIFICAÇÃO
   * ----------------------------------------------------
   */

  function iniciarDecoding(){

    if(!codeReader){
      return;
    }

    try{

      codeReader.decodeFromVideoElement(
        video,
        function(result,error){

          if(!scannerAtivo){
            return;
          }

          if(codigoEncontrado){
            return;
          }


          /*
           * Se não encontrou nada,
           * continuamos silenciosamente.
           */

          if(!result){

            if(
              error &&
              error.name &&
              error.name !==
                'NotFoundException'
            ){

              /*
               * Não mostramos erros normais
               * de procura no ecrã.
               */

            }

            return;
          }


          let codigo = '';

          try{

            codigo =
              String(
                result.getText() || ''
              )
              .trim()
              .replace(/\s+/g,'');

          }catch(e){

            console.warn(
              'Erro ao obter texto:',
              e
            );

            return;

          }


          if(!codigo){
            return;
          }


          debug.textContent =
            'Código detetado: ' +
            codigo;


          /*
           * ------------------------------------------------
           * LIMPEZA
           * ------------------------------------------------
           *
           * Alguns leitores podem devolver:
           *
           * (00)123456789012345678
           *
           * ou caracteres auxiliares.
           *
           * Primeiro retiramos espaços.
           */

          let codigoLimpo =
            limparCodigoGS1(codigo);


          /*
           * O sistema atual trabalha com código
           * exclusivamente numérico.
           */

          if(!/^\d+$/.test(codigoLimpo)){

            cameraStatus.className =
              'status warning';

            cameraStatus.textContent =
              'Código detetado, mas contém caracteres não numéricos. Continue a apontar para o SSCC.';

            return;

          }


          /*
           * Não aceitar códigos demasiado pequenos.
           */

          if(codigoLimpo.length < 22){

            cameraStatus.className =
              'status warning';

            cameraStatus.textContent =
              'Código detetado, mas demasiado curto para o SSCC deste sistema.';

            return;

          }


          /*
           * SUCESSO
           */

          codigoEncontrado = true;

          cameraStatus.className =
            'status ok';

          cameraStatus.textContent =
            '✓ SSCC encontrado. A enviar...';

          resultadoCode.textContent =
            codigoLimpo;

          resultado.style.display =
            'block';


          pararCamera();


          devolverSSCC(
            codigoLimpo
          );

        }
      );

    }catch(e){

      console.error(
        'Erro no decode:',
        e
      );

      cameraStatus.className =
        'status error';

      cameraStatus.textContent =
        'Erro no leitor de códigos: ' +
        e.message;

    }

  }


  /*
   * ----------------------------------------------------
   * LIMPAR GS1 / CODE 128
   * ----------------------------------------------------
   */

  function limparCodigoGS1(codigo){

    let valor =
      String(codigo || '')
        .trim()
        .replace(/\s+/g,'');


    /*
     * Retirar prefixo típico do AI (00)
     * caso o leitor devolva "(00)".
     */

    if(
      valor.startsWith('(00)')
    ){

      valor =
        valor.substring(4);

    }


    /*
     * Alguns leitores podem devolver
     * o prefixo 00 diretamente.
     *
     * NÃO o retiramos automaticamente,
     * porque o backend atual pode estar
     * a trabalhar com a estrutura própria
     * do teu SSCC.
     */


    /*
     * Retirar caracteres GS1 invisíveis,
     * se forem devolvidos.
     */

    valor =
      valor.replace(
        /[\x1D\x1E\x1F]/g,
        ''
      );


    return valor;

  }


  /*
   * ----------------------------------------------------
   * PARAR CÂMARA
   * ----------------------------------------------------
   */

  function pararCamera(){

    scannerAtivo = false;


    try{

      if(codeReader){

        try{

          codeReader.reset();

        }catch(e){

          console.warn(
            'Erro ao fazer reset do leitor:',
            e
          );

        }

      }

    }catch(e){

      console.warn(e);

    }


    codeReader = null;


    if(cameraStream){

      try{

        cameraStream
          .getTracks()
          .forEach(
            function(track){

              track.stop();

            }
          );

      }catch(e){

        console.warn(e);

      }

    }


    cameraStream = null;


    try{

      video.pause();
      video.srcObject = null;

    }catch(e){

      console.warn(e);

    }


    btnStart.disabled = false;
    btnStop.disabled = true;

  }


  /*
   * ----------------------------------------------------
   * DEVOLVER SSCC À APLICAÇÃO
   * ----------------------------------------------------
   */

  function devolverSSCC(codigo){

    try{

      const params =
        new URLSearchParams(
          window.location.search
        );

      const returnUrl =
        params.get('return');


      if(!returnUrl){

        cameraStatus.className =
          'status error';

        cameraStatus.textContent =
          'SSCC encontrado, mas não foi definido um endereço de retorno.';

        btnStart.disabled = false;

        return;

      }


      let url;

      try{

        url =
          new URL(returnUrl);

      }catch(e){

        throw new Error(
          'O endereço de retorno não é válido.'
        );

      }


      url.searchParams.set(
        'sscc',
        codigo
      );


      cameraStatus.className =
        'status ok';

      cameraStatus.textContent =
        '✓ SSCC lido. A regressar à aplicação...';


      setTimeout(
        function(){

          window.location.href =
            url.toString();

        },
        700
      );


    }catch(e){

      console.error(
        'ERRO AO DEVOLVER SSCC:',
        e
      );

      cameraStatus.className =
        'status error';

      cameraStatus.textContent =
        'SSCC encontrado, mas não foi possível regressar à aplicação.';

      btnStart.disabled = false;

    }

  }


  /*
   * ----------------------------------------------------
   * PROCESSAMENTO MANUAL
   * ----------------------------------------------------
   */

  function processarManual(){

    const codigo =
      String(
        scanner.value || ''
      )
      .trim()
      .replace(/\s+/g,'');


    if(!codigo){

      alert(
        'Introduza um SSCC.'
      );

      scanner.focus();

      return;

    }


    resultadoCode.textContent =
      codigo;

    resultado.style.display =
      'block';


    processarCodigo(
      codigo
    );

  }


  /*
   * ----------------------------------------------------
   * PROCESSAR SSCC
   * ----------------------------------------------------
   */

  function processarCodigo(codigo){

    const valor =
      String(
        codigo || ''
      )
      .trim()
      .replace(/\s+/g,'');


    if(!valor){

      cameraStatus.className =
        'status error';

      cameraStatus.textContent =
        'SSCC vazio.';

      return;

    }


    cameraStatus.className =
      'status';

    cameraStatus.textContent =
      'A processar SSCC...';


    /*
     * Chamada ao Google Apps Script.
     */

    google.script.run

      .withSuccessHandler(
        function(resposta){

          try{

            if(
              resposta &&
              resposta.ok
            ){

              cameraStatus.className =
                'status ok';

              cameraStatus.textContent =
                resposta.mensagem ||
                'SSCC processado com sucesso.';

            }else{

              cameraStatus.className =
                'status error';

              cameraStatus.textContent =
                resposta &&
                resposta.mensagem
                  ? resposta.mensagem
                  : 'Erro ao processar SSCC.';

            }

          }catch(e){

            console.error(e);

            cameraStatus.className =
              'status error';

            cameraStatus.textContent =
              'Resposta inválida do servidor.';

          }

        }
      )

      .withFailureHandler(
        function(erro){

          console.error(
            'Erro Google Apps Script:',
            erro
          );

          cameraStatus.className =
            'status error';

          cameraStatus.textContent =
            'Erro de comunicação com a aplicação.';

        }
      )

      .webProcessarSSCC(
        valor
      );

  }


  /*
   * ----------------------------------------------------
   * ERROS DA CÂMARA
   * ----------------------------------------------------
   */

  function traduzirErroCamera(erro){

    if(!erro){
      return 'Não foi possível iniciar a câmara.';
    }


    const nome =
      erro.name || '';


    if(
      nome ===
      'NotAllowedError'
    ){

      return 'PERMISSÃO DE CÂMARA RECUSADA. Verifique as permissões do navegador.';

    }


    if(
      nome ===
      'NotFoundError'
    ){

      return 'Não foi encontrada nenhuma câmara neste dispositivo.';

    }


    if(
      nome ===
      'NotReadableError'
    ){

      return 'A câmara está a ser utilizada por outra aplicação.';

    }


    if(
      nome ===
      'SecurityError'
    ){

      return 'O navegador bloqueou o acesso à câmara por motivos de segurança.';

    }


    if(
      nome ===
      'AbortError'
    ){

      return 'O acesso à câmara foi interrompido.';

    }


    return (
      'Não foi possível iniciar a câmara: ' +
      (erro.message || nome)
    );

  }


  /*
   * ----------------------------------------------------
   * ENTER NO CAMPO MANUAL
   * ----------------------------------------------------
   */

  scanner.addEventListener(
    'keydown',
    function(e){

      if(
        e.key ===
        'Enter'
      ){

        e.preventDefault();

        processarManual();

      }

    }
  );


</script>

</body>
</html>
